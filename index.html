<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reino da Peteca - Sistema de Gestão</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>🏸 Reino da Peteca</h1>
        <p>Sistema de Gestão de Atletas</p>
    </header>

    <div class="container">
        <!-- Abas de Navegação -->
        <!-- Abas de Navegação -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('cadastro')">Cadastro</button>
            <button class="tab-btn" onclick="switchTab('frequencia')">Frequência</button>
            <button class="tab-btn" onclick="switchTab('atividade')">Nova Atividade</button>
            <button class="tab-btn" onclick="switchTab('desempenho')">Desempenho</button>
            <button class="tab-btn" onclick="switchTab('atletas')">Atletas</button>
        </div>

        <!-- ABA 1: CADASTRO -->
        <div id="cadastro" class="form-section active">
            <h2>Cadastro de Atleta</h2>
            <form id="formCadastro" onsubmit="enviarDados(event, 'cadastro')">
                <div class="form-group">
                    <label>ID do Atleta (Automático):</label>
                    <input type="number" id="cad_id" readonly style="background-color: #e9ecef; cursor: not-allowed;"
                        required>
                </div>
                <div class="form-group">
                    <label>Nome Completo:</label>
                    <input type="text" id="cad_nome" required placeholder="Nome do atleta">
                </div>
                <div class="form-group">
                    <label>Data de Nascimento:</label>
                    <input type="date" id="cad_nascimento" required onchange="calcularIdade()" onblur="calcularIdade()">
                </div>
                <div class="form-group">
                    <label>Idade:</label>
                    <input type="number" id="cad_idade" readonly placeholder="Calculada automaticamente">
                </div>
                <div class="form-group">
                    <label>Responsável:</label>
                    <input type="text" id="cad_responsavel" placeholder="Nome do responsável">
                </div>
                <div class="form-group">
                    <label>Contato (Telefone):</label>
                    <input type="number" id="cad_contato" placeholder="Apenas números com DDD">
                </div>
                <button type="submit" class="submit-btn">Salvar Cadastro</button>
            </form>
        </div>

        <!-- ABA 2: FREQUENCIA -->
        <div id="frequencia" class="form-section">
            <h2>Registro de Frequência</h2>
            <form id="formFrequencia" onsubmit="enviarDados(event, 'frequencia')">
                <input type="hidden" id="freq_id">
                <div class="form-group">
                    <label>Atleta:</label>
                    <select id="freq_select_atleta" required onchange="atualizarAtletaSelecionado('freq')">
                        <option value="">Carregando atletas...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Data:</label>
                    <input type="date" id="freq_data" required>
                </div>
                <div class="form-group">
                    <label>Situação:</label>
                    <select id="freq_situacao" required>
                        <option value="P">P - Presente</option>
                        <option value="F">F - Faltou</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Justificativa (caso faltou):</label>
                    <textarea id="freq_justificativa" placeholder="Motivo da falta (opcional)"></textarea>
                </div>
                <button type="submit" class="submit-btn">Registrar Frequência</button>
            </form>
        </div>

        <!-- ABA 3: CRIAR ATIVIDADE -->
        <div id="atividade" class="form-section">
            <h2>Cadastrar Nova Atividade</h2>
            <form id="formCriarAtividade" onsubmit="enviarDados(event, 'criar_atividade')">
                <div class="form-group">
                    <label>ID da Atividade (Automático):</label>
                    <input type="number" id="ativ_id" readonly style="background-color: #e9ecef; cursor: not-allowed;"
                        required>
                </div>
                <div class="form-group">
                    <label>Nome da Atividade:</label>
                    <input type="text" id="ativ_nome_atividade" required
                        placeholder="Ex: Treino de Saque, Circuito de Agilidade">
                </div>
                <div class="form-group">
                    <label>Data:</label>
                    <input type="date" id="ativ_data" required>
                </div>
                <div class="form-group">
                    <label>Situação:</label>
                    <select id="ativ_situacao" required>
                        <option value="ATIVO">ATIVO</option>
                        <option value="CANCELADO">CANCELADO</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tipo:</label>
                    <select id="ativ_tipo" required>
                        <option value="VOLTAS">VOLTAS</option>
                        <option value="MINUTOS">MINUTOS</option>
                        <option value="REPETICAO">REPETICAO</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn">Salvar Atividade</button>
            </form>
        </div>

        <!-- ABA 4: DESEMPENHO -->
        <div id="desempenho" class="form-section">
            <h2>Registro de Desempenho do Atleta</h2>
            <form id="formDesempenho" onsubmit="enviarDados(event, 'desempenho')">
                <!-- IDs ocultos preenchidos automaticamente -->
                <input type="hidden" id="des_id_atividade">
                <input type="hidden" id="des_id_atleta">

                <div class="form-group">
                    <label>Atividade:</label>
                    <select id="des_select_atividade" required onchange="atualizarAtividadeSelecionada()">
                        <option value="">Carregando atividades...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Atleta:</label>
                    <select id="des_select_atleta" required onchange="atualizarAtletaDesempenho()">
                        <option value="">Carregando atletas...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Desempenho (Campo Livre):</label>
                    <input type="text" id="des_desempenho" required
                        placeholder="Ex: 15 voltas completadas / 30 repetições">
                </div>
                <div class="form-group">
                    <label>Data:</label>
                    <input type="date" id="des_data" required>
                </div>
                <button type="submit" class="submit-btn">Salvar Desempenho</button>
            </form>
        </div>

        <!-- ABA 5: ATLETAS (LISTAGEM E RELATÓRIO) -->
        <div id="atletas" class="form-section">
            <h2>Relatório Geral de Atletas</h2>

            <div class="filter-bar">
                <div>
                    <label>Período:</label>
                    <select id="filtro_periodo" onchange="renderizarTabelaAtletas()">
                        <option value="semana">Última Semana</option>
                        <option value="mes" selected>Último Mês</option>
                        <option value="ano">Último Ano</option>
                        <option value="todos">Todo o Período</option>
                    </select>
                </div>
                <div>
                    <label>Exibir:</label>
                    <select id="filtro_itens_pagina" onchange="mudarItensPorPagina()">
                        <option value="10">10 por página</option>
                        <option value="20">20 por página</option>
                        <option value="30">30 por página</option>
                    </select>
                </div>
            </div>

            <div class="table-responsive">
                <table class="atletas-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>Responsável</th>
                            <th>Presenças</th>
                            <th>Atividades Realizadas</th>
                        </tr>
                    </thead>
                    <tbody id="tabela_atletas_corpo">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>

            <div class="pagination-container">
                <button id="btn_anterior" onclick="paginaAnterior()" class="page-btn">Anterior</button>
                <span id="info_paginacao">Página 1 de 1</span>
                <button id="btn_proximo" onclick="proximaPagina()" class="page-btn">Próxima</button>
            </div>
        </div>

        <div id="loading" class="loading">Salvando dados na planilha... Aguarde.</div>
    </div>
</body>

</html>
